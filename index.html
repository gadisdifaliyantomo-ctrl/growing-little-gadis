<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍓 Growing Little Gadis</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'VT323', monospace;
background:#ffd6e7;
background-image:
linear-gradient(#ffffff33 1px, transparent 1px),
linear-gradient(90deg,#ffffff33 1px, transparent 1px);
background-size:24px 24px;
min-height:100vh;
padding:20px;
}

.gameboy{

max-width:420px;
margin:auto;

background:#fff7fa;

border:6px solid #000;

box-shadow:8px 8px 0 #000;

padding:18px;

}

.title{

text-align:center;
font-size:42px;
line-height:1.1;

margin-bottom:18px;

}

.weather{

text-align:center;

font-size:28px;

margin-bottom:10px;

}

.screen{

background:#d8ffd8;

border:5px solid #000;

padding:15px;

margin-bottom:15px;

text-align:center;

}

.mascot{

width:220px;

max-width:100%;

animation:float 2s infinite ease-in-out;

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-6px);}
100%{transform:translateY(0);}

}

.dialog{

background:white;

border:4px solid black;

padding:10px;

font-size:24px;

margin-top:12px;

}

.world{

background:white;

border:4px solid black;

padding:12px;

margin-bottom:15px;

}

.world-title{

font-size:28px;

margin-bottom:8px;

}

.world-decor{

font-size:34px;

text-align:center;

}

.progress-box{

background:white;

border:4px solid black;

padding:12px;

margin-bottom:15px;

}

.progress{

height:24px;

border:3px solid black;

background:#fff;

overflow:hidden;

}

.fill{

height:100%;

width:0%;

background:#ff75b5;

transition:.4s;

}

.counter{

text-align:center;

font-size:28px;

margin-top:8px;

}

button{

width:100%;

padding:16px;

font-size:30px;

font-family:'VT323', monospace;

border:4px solid black;

background:#ff75b5;

box-shadow:5px 5px 0 black;

cursor:pointer;

}

button:active{

transform:translate(5px,5px);

box-shadow:none;

}

.status{

text-align:center;

margin-top:12px;

font-size:24px;

min-height:30px;

}

.footer{

margin-top:15px;

text-align:center;

font-size:20px;

}

</style>
</head>

<body>

<div class="gameboy">

<div class="title">
🍓 GROWING<br>GADIS 🍓
</div>

<div class="weather" id="mood">
☀️ Sedang Sarapan
</div>

<div class="screen">

<img
src="gadis-berry.png"
class="mascot"
>

<div class="dialog" id="dialog">
Haiii! Makasih sudah mampir 🍓
</div>

</div>

<div class="world">

<div class="world-title">
🌎 WORLD LEVEL
</div>

<div class="world-decor" id="decor">
🍓
</div>

</div>

<div class="progress-box">

<div class="progress">

<div class="fill" id="fill"></div>

</div>

<div class="counter">
<span id="energy">0</span> / 10000
</div>

</div>

<button onclick="support()">
💖 KIRIM SEMANGAT
</button>

<div class="status" id="status"></div>

<div class="footer">
Community Project by Gadis 🍓
</div>

</div>

<script>

let energy =
Number(localStorage.getItem("energy") || 0);

const dialogs = [

"Aku senang kamu datang hari ini 🍓",

"Semangatmu membuatku lebih kuat 💖",

"Besok mampir lagi ya ✨",

"Aku sedang berusaha tumbuh 🌱",

"Kita bangun dunia ini bersama 🥺",

"Terima kasih sudah support aku 🍓"

];

function updateMood(){

const hour = new Date().getHours();

let mood = "";

if(hour >= 6 && hour < 10)
mood = "☀️ Sedang Sarapan";

else if(hour < 14)
mood = "📷 Sedang Foto Studio";

else if(hour < 18)
mood = "☕ Sedang Nongkrong";

else if(hour < 22)
mood = "🎤 Sedang Latihan Idol";

else
mood = "😴 Sudah Mengantuk";

document.getElementById("mood").innerText = mood;

}

function updateWorld(){

let decor = "🍓";

if(energy >= 100)
decor = "🌱 🍓";

if(energy >= 500)
decor = "🌱 🌷 🍓";

if(energy >= 1000)
decor = "🏡 🌷 🍓";

if(energy >= 3000)
decor = "☕ 🏡 🌷 🍓";

if(energy >= 5000)
decor = "🎤 ☕ 🏡 🌷 🍓";

if(energy >= 10000)
decor = "👑 🎤 ☕ 🏡 🌷 🍓";

document.getElementById("decor").innerHTML = decor;

}

function render(){

document.getElementById("energy").innerText = energy;

document.getElementById("fill").style.width =
Math.min((energy/10000)*100,100)+"%";

updateWorld();

}

function support(){

energy++;

localStorage.setItem("energy", energy);

document.getElementById("status").innerText =
"🍓 Gadis menerima semangatmu!";

document.getElementById("dialog").innerText =
dialogs[Math.floor(Math.random()*dialogs.length)];

render();

}

updateMood();

render();

</script>

</body>
</html>
