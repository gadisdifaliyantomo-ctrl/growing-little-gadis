<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍓 Growing Little Gadis</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

  <h1>🍓 Growing Little Gadis</h1>

  <div class="mood" id="mood">
    ☀️ Sedang Sarapan
  </div>

  <div class="bubble" id="bubble">
    Haiii! Makasih sudah mampir hari ini 💖
  </div>

  <div class="mascot-area">

    <img
      src="gadis-berry.PNG"
      class="mascot"
      id="mascot"
      alt="Gadis Berry"
    >

    <div id="hearts"></div>

  </div>

  <div class="world-card">

    <div class="world-title">
      🌸 Dunia Gadis
    </div>

    <div class="world-stage" id="worldStage">
      🍓
    </div>

  </div>

  <div class="progress-card">

    <div class="progress-title">
      💖 Semangat untuk Gadis
    </div>

    <div class="progress">

      <div class="fill" id="fill"></div>

    </div>

    <div class="counter">
      <span id="energy">0</span> / 300
    </div>

  </div>

  <button id="supportBtn">
    💖 Kirim Semangat
  </button>

  <div class="message-card">

    <input
      type="text"
      id="messageInput"
      maxlength="80"
      placeholder="Tulis pesan untuk Gadis..."
    >

    <button id="messageBtn">
      💌 Kirim Pesan
    </button>

  </div>

  <div class="latest">

    <h3>🌸 Pesan Terbaru</h3>

    <div id="latestMessage">
      Belum ada pesan...
    </div>

  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
